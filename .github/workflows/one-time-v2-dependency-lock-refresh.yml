name: One-time V2 dependency lock refresh

on:
  push:
    branches:
      - fix/v2-08-dependency-lock-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V2-08 integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-08-live-nova-transport
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin the official patched SheetJS release and refresh lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies.xlsx = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high || true
      - name: Commit reviewed dependency resolution to integration branch
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): patch spreadsheet parser and refresh lockfile"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dingbee/personal-intelligence-platform.git"
          git push origin HEAD:feat/v2-08-live-nova-transport
