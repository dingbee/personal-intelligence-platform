name: One-time V2 dependency lock refresh

on:
  push:
    branches:
      - fix/v2-08-dependency-lock-refresh
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V2-08 integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-08-live-nova-transport
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched production dependencies
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies.xlsx = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            '@xmldom/xmldom': '^0.8.15',
            'dompurify': '^3.4.16',
            'react-router': '^7.18.2'
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high || true
      - name: Export generated lockfile for API update
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const encoded = Buffer.from(fs.readFileSync('package-lock.json')).toString('base64')
          const chunkSize = 5000
          for (let offset = 0, index = 0; offset < encoded.length; offset += chunkSize, index++) {
            console.log('LOCK_CHUNK_' + String(index).padStart(3, '0') + ':' + encoded.slice(offset, offset + chunkSize))
          }
          const pkg = Buffer.from(fs.readFileSync('package.json')).toString('base64')
          console.log('PACKAGE_JSON_BASE64:' + pkg)
          NODE
