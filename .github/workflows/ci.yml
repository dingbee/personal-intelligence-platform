name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase URL and publishable key are intentionally public client configuration.
      # Keep CI self-contained; secrets are not required for the browser test suite.
      VITE_SUPABASE_URL: https://uzshazetfkjkrdnxwjtl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_-sHXfUg6uahuVY_m1jJJMA_qKGYpD1j
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Targeted tests
        run: npm run test -- --exclude '**/AIService.test.ts'

      - name: Production build
        run: npm run build

      - name: Bundle verification
        run: npm run verify:bundle

  known-test-debt:
    name: Full suite (known AIService debt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      # Supabase URL and publishable key are intentionally public client configuration.
      # Keep CI self-contained; secrets are not required for the browser test suite.
      VITE_SUPABASE_URL: https://uzshazetfkjkrdnxwjtl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_-sHXfUg6uahuVY_m1jJJMA_qKGYpD1j
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm run test
