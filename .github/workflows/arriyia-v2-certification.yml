name: ARRIYIA V2 Certification

on:
  push:
    branches:
      - v2-development
  pull_request:
    branches:
      - v2-development

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc -b
      - name: Lint
        run: npx oxlint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
