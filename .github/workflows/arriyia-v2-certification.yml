name: ARRIYIA V2 Certification

on:
  push:
    branches:
      - v2-development
      - 'feat/if-03-*'
      - 'feat/if-04-*'
  pull_request:
    branches:
      - v2-development
      - feat/if-02-shared-intelligence-foundation
      - feat/if-03-domain-capabilities

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc -b
      - name: Lint
        run: npx oxlint
      - name: Unit tests
        run: npx vitest run src/modules/v2
      - name: Production build
        run: npm run build
