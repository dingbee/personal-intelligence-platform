<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         real values on notched/home-indicator iPhones instead of 0; without
         it, the page never extends under those areas and the inset env()
         vars stay at their zero default. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ARRIYIA</title>
    <!-- Post-10/10 Phase 3 (Documentation, Public Identity & Domain Readiness) —
         description/OG/Twitter metadata for the ARRIYIA identity. Deliberately
         omits og:url/og:image: no approved public domain or share-image asset
         exists yet, and inventing either would misrepresent unlaunched state. -->
    <meta name="description" content="ARRIYIA — Personal Intelligence Platform. Organize, understand, connect, and use the knowledge that matters to you." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARRIYIA — Personal Intelligence Platform" />
    <meta property="og:description" content="Organize, understand, connect, and use the knowledge that matters to you." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ARRIYIA — Personal Intelligence Platform" />
    <meta name="twitter:description" content="Organize, understand, connect, and use the knowledge that matters to you." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
